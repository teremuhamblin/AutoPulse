[project]
name = "AutoPulse"
version = "1.0.0"
description = "Minimal modular automation engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pyyaml"
]

[tool.setuptools]
packages = ["AutoPulse"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
